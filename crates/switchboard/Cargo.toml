[package]
name = "switchboard"
description = "OpenAI-compatible LLM gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "switchboard"
path = "src/lib.rs"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[[bin]]
name = "sbctl"
path = "src/bin/sbctl.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

# docs/13 §P5. Boots the real router against a stub upstream whose latency it chooses,
# because "gateway overhead" is a subtraction and you cannot do a subtraction without
# knowing both terms.
[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "set-header"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
deadpool-redis = { version = "0.19", features = ["rt_tokio_1"] }
redis = { version = "0.28", features = ["script"] }
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"
toml = "0.8"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tiktoken-rs = "0.6"
thiserror = "2"
async-trait = "0.1"
argon2 = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
bytes = "1"
http = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
moka = { version = "0.12", features = ["future"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.9"
base64 = "0.22"
sqlparser = "0.53"
jsonschema = "0.29"
alloy-primitives = { version = "1", features = ["std"] }
rmcp = { version = "0.16", features = ["client", "transport-child-process", "transport-io"] }
pgvector = { version = "0.4", features = ["sqlx"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[dev-dependencies]
wiremock = "0.6"
proptest = "1"
tokio-test = "0.4"
