name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.check.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet. Rust jobs skipped."
          fi

  rust:
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  conformance:
    needs: rust
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96

      - uses: Swatinem/rust-cache@v2

      - name: Build switchboard
        run: cargo build --bin switchboard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance deps
        run: pip install -r tests/conformance/requirements.txt

      - name: Conformance tests
        run: pytest tests/conformance

  eval-fast:
    needs: rust
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Eval (fast, offline smoke)
        run: cargo run --bin eval -- --suite fast

  # docs/13 §P5. Runs with `--no-latency-slo`: a shared runner is a noisy neighbour with an
  # unknown number of other tenants on the box, and a p99 measured there is not a fact about
  # this gateway. Failing a build on it would teach everyone to rerun CI until it passes,
  # which is how a test stops meaning anything — the exact anti-pattern docs/15 §8 names.
  #
  # What CI does enforce are the structural claims, which hold on any hardware: the gateway
  # sheds rather than queues, a dead provider falls back rather than 500s, /health never fails
  # while saturated, and `sb_requests_shed_total` equals the number of 503s the client counted.
  # The percentiles are printed either way.
  load-test:
    needs: rust
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2

      - name: Migrate
        run: cargo run --bin sbctl -- migrate

      - name: Load test (structural assertions; percentiles reported, not enforced)
        run: |
          cargo run --release --bin loadtest -- \
            --scenario all --duration-secs 8 --no-latency-slo --json target/loadtest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-results
          path: target/loadtest.json
          if-no-files-found: warn

  docker:
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t switchboard:ci .
